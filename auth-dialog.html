<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mail Merge – Sign In</title>
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self';
             script-src 'self' https://appsforoffice.microsoft.com https://alcdn.msauth.net https://cdn.jsdelivr.net https://*.duosecurity.com https://*.duoapis.com 'unsafe-inline';
             connect-src 'self' https://login.microsoftonline.com https://login.microsoft.com https://graph.microsoft.com https://sts.windows.net https://appsforoffice.microsoft.com https://*.duosecurity.com https://*.duoapis.com https://duosecurity.com;
             style-src 'self' 'unsafe-inline' https://*.duosecurity.com;
             img-src 'self' data: https://login.microsoftonline.com https://*.duosecurity.com https://*.duoapis.com;
             frame-src 'self' https://login.microsoftonline.com https://login.microsoft.com https://*.duosecurity.com https://*.duoapis.com;" />

  <!-- Office.js must load first -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      background: linear-gradient(140deg, #0C0A1A 0%, #16123A 45%, #0D1B38 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #fff;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ── Ambient background orbs ─────────────────────── */
    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(70px);
      pointer-events: none;
      z-index: 0;
    }
    .bg-orb-1 {
      width: 340px; height: 340px;
      background: rgba(83,74,183,0.25);
      top: -100px; right: -100px;
      animation: drift 9s ease-in-out infinite;
    }
    .bg-orb-2 {
      width: 220px; height: 220px;
      background: rgba(245,130,32,0.18);
      bottom: -70px; left: -50px;
      animation: drift 11s ease-in-out infinite reverse;
    }
    .bg-orb-3 {
      width: 160px; height: 160px;
      background: rgba(83,74,183,0.12);
      bottom: 30%; right: -40px;
      animation: drift 7s ease-in-out infinite 2s;
    }
    @keyframes drift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%       { transform: translate(16px, -20px) scale(1.05); }
    }

    /* ── Card ────────────────────────────────────────── */
    .card {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.045);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 24px;
      padding: 44px 36px 30px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow:
        0 30px 80px rgba(0,0,0,0.55),
        inset 0 1px 0 rgba(255,255,255,0.12),
        inset 0 -1px 0 rgba(0,0,0,0.2);
    }

    /* ── Icon + pulse rings ──────────────────────────── */
    .icon-wrap {
      position: relative;
      width: 80px; height: 80px;
      margin: 0 auto 26px;
    }

    /* Rings animate outward from the icon */
    .pulse-ring {
      position: absolute;
      inset: 0;
      border: 1.5px solid rgba(245,130,32,0.55);
      border-radius: 20px;
      animation: pulse-out 2.6s cubic-bezier(0.3,0,0.7,1) infinite;
      pointer-events: none;
    }
    .pulse-ring:nth-child(2) { animation-delay: 0.87s; }
    .pulse-ring:nth-child(3) { animation-delay: 1.74s; }

    @keyframes pulse-out {
      0%   { opacity: 0.75; transform: scale(1); }
      70%  { opacity: 0.2; }
      100% { opacity: 0;   transform: scale(1.9); }
    }

    .icon-img {
      position: relative;
      z-index: 1;
      width: 80px; height: 80px;
      border-radius: 18px;
      box-shadow:
        0 10px 28px rgba(0,0,0,0.45),
        0 0 0 1px rgba(255,255,255,0.10);
    }

    /* Error state — icon turns red-ish */
    .icon-img.error-state { filter: grayscale(0.4) brightness(0.8); }

    /* ── App name + byline ───────────────────────────── */
    .app-name {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
      margin-bottom: 5px;
    }



    /* ── Step label ──────────────────────────────────── */
    #stepLabel {
      font-size: 13.5px;
      color: rgba(255,255,255,0.65);
      margin-bottom: 14px;
      min-height: 20px;
      transition: opacity 0.25s;
    }

    /* ── Progress bar ────────────────────────────────── */
    .progress-track {
      background: rgba(255,255,255,0.08);
      border-radius: 99px;
      height: 5px;
      overflow: hidden;
      margin-bottom: 18px;
    }

    #progressFill {
      height: 100%;
      border-radius: 99px;
      width: 0%;
      background: linear-gradient(90deg, #534AB7 0%, #F58220 100%);
      box-shadow: 0 0 12px rgba(245,130,32,0.5);
      transition: width 0.55s cubic-bezier(0.4,0,0.2,1);
      position: relative;
    }

    /* Shimmer on the fill */
    #progressFill::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255,255,255,0.4) 50%,
        transparent 100%
      );
      background-size: 200% 100%;
      animation: shimmer 1.8s ease infinite;
    }

    @keyframes shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position:  200% 0; }
    }

    /* ── Step dots ───────────────────────────────────── */
    .step-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 26px;
    }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: rgba(255,255,255,0.13);
      transition: all 0.35s cubic-bezier(0.4,0,0.2,1);
    }

    .dot.active {
      background: #F58220;
      box-shadow: 0 0 10px rgba(245,130,32,0.8);
      transform: scale(1.35);
    }

    .dot.done {
      background: rgba(245,130,32,0.4);
      transform: scale(1);
    }

    /* ── Error box ───────────────────────────────────── */
    #errorBox {
      display: none;
      background: rgba(192,37,42,0.14);
      border: 1px solid rgba(192,37,42,0.30);
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 12.5px;
      color: #F07070;
      margin-bottom: 18px;
      text-align: left;
      line-height: 1.55;
    }

    /* ── Divider ─────────────────────────────────────── */
    .divider {
      height: 1px;
      background: rgba(255,255,255,0.07);
      margin: 0 -36px 14px;
    }

    /* ── Debug log ───────────────────────────────────── */
    #debugLog {
      width: 100%;
      max-height: 120px;
      overflow-y: auto;
      font-family: 'Cascadia Code', 'Consolas', monospace;
      font-size: 10px;
      color: rgba(255,255,255,0.28);
      text-align: left;
      line-height: 1.75;
    }

    #debugLog::-webkit-scrollbar { width: 3px; }
    #debugLog::-webkit-scrollbar-track { background: transparent; }
    #debugLog::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.12);
      border-radius: 99px;
    }

    .log-line {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .log-err { color: rgba(240,112,112,0.75); }
    .log-ok  { color: rgba(111,207,151,0.6); }
  </style>
</head>
<body>

  <!-- Ambient orbs -->
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-orb bg-orb-3"></div>

  <div class="card">

    <!-- Icon with pulse rings -->
    <div class="icon-wrap">
      <div class="pulse-ring"></div>
      <div class="pulse-ring"></div>
      <div class="pulse-ring"></div>
      <img src="assets/icon-color.png" alt="Mail Merge" class="icon-img" id="iconImg" />
    </div>

    <div class="app-name">Mail Merge</div>

    <!-- Current step label -->
    <div id="stepLabel">Loading authentication…</div>

    <!-- Progress bar -->
    <div class="progress-track">
      <div id="progressFill"></div>
    </div>

    <!-- Step dots (5 stages) -->
    <div class="step-dots">
      <div class="dot active" id="dot0" title="Loading"></div>
      <div class="dot"        id="dot1" title="Office ready"></div>
      <div class="dot"        id="dot2" title="Initialising"></div>
      <div class="dot"        id="dot3" title="Checking session"></div>
      <div class="dot"        id="dot4" title="Signing in"></div>
    </div>

    <!-- Error box (hidden until error) -->
    <div id="errorBox"></div>

    <div class="divider"></div>

    <!-- Inline debug log -->
    <div id="debugLog"></div>

  </div>

  <!-- ── Early logging — fires before MSAL loads ────────────── -->
  <script>
    var logEl = document.getElementById("debugLog");

    function dbg(msg, cls) {
      var d = document.createElement("div");
      d.className = "log-line" + (cls ? " " + cls : "");
      d.textContent = new Date().toISOString().slice(11, 22) + " " + msg;
      logEl.appendChild(d);
      logEl.scrollTop = logEl.scrollHeight;
    }

    // Step-progress helpers
    var STEPS = [
      "Loading authentication…",
      "Preparing Office runtime…",
      "Initialising secure session…",
      "Checking for existing sign-in…",
      "Redirecting to Microsoft…"
    ];
    var PROGRESS = [12, 28, 52, 72, 92];

    function setStep(n, labelOverride) {
      document.getElementById("stepLabel").textContent = labelOverride || STEPS[n] || "";
      document.getElementById("progressFill").style.width = PROGRESS[n] + "%";
      for (var i = 0; i < 5; i++) {
        var dot = document.getElementById("dot" + i);
        dot.className = "dot" + (i < n ? " done" : i === n ? " active" : "");
      }
    }

    function showError(msg) {
      // Stop pulse rings
      var rings = document.querySelectorAll(".pulse-ring");
      rings.forEach(function(r) { r.style.animationPlayState = "paused"; r.style.opacity = "0"; });
      document.getElementById("iconImg").classList.add("error-state");
      document.getElementById("progressFill").style.background = "#C4252A";
      document.getElementById("progressFill").style.boxShadow = "none";
      document.getElementById("progressFill").style.width = "100%";
      document.getElementById("stepLabel").textContent = "Sign-in failed";
      var box = document.getElementById("errorBox");
      box.textContent = msg;
      box.style.display = "block";
      dbg("ERROR: " + msg, "log-err");
    }

    dbg("Page loaded — loading MSAL...");
    setStep(0);
  </script>

  <!-- MSAL from jsDelivr (primary) with alcdn fallback -->
  <script
    src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"
    crossorigin="anonymous"
    onerror="dbg('jsDelivr MSAL FAILED — trying alcdn', 'log-err'); loadMsalFallback();">
  </script>

  <script>
    function loadMsalFallback() {
      var s = document.createElement("script");
      s.src = "https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js";
      s.crossOrigin = "anonymous";
      s.onload  = function() { dbg("alcdn fallback loaded OK", "log-ok"); startAuth(); };
      s.onerror = function() {
        dbg("BOTH MSAL CDNs failed!", "log-err");
        showError("Could not load the authentication library. Please check your network connection and try again.");
      };
      document.head.appendChild(s);
    }

    if (typeof msal !== "undefined") {
      dbg("MSAL loaded OK from jsDelivr", "log-ok");
    }
  </script>

  <script>
    Office.initialize = function() {};

    const CLIENT_ID    = "d06ae3cf-a7da-4264-b20e-ab8d70c06977";
    const TENANT_ID    = "04ca7ab1-691d-45a2-928f-574b3e3300a0";
    const REDIRECT_URI = window.location.href.split('?')[0];
    const SCOPES       = ["https://graph.microsoft.com/Mail.Send", "https://graph.microsoft.com/User.Read"];

    function sendToParent(data) {
      dbg("sendToParent → " + data.type);
      var payload = JSON.stringify(data);

      // Write to localStorage first as a fallback channel for legacy Mac Outlook
      // where Office.context.ui.messageParent is unavailable after dialog loads.
      // The taskpane polls this key and picks up the result if messageParent never fires.
      try {
        localStorage.setItem('mm_auth_result', JSON.stringify(
          Object.assign({}, data, { ts: Date.now() })
        ));
        dbg("localStorage fallback written", "log-ok");
      } catch (lsErr) {
        dbg("localStorage write failed: " + lsErr.message);
      }

      function tryMessageParent(attempts) {
        if (attempts <= 0) {
          dbg("messageParent exhausted — localStorage fallback active, dialog will stay open");
          showError("Sign-in complete — waiting for Outlook to close this window…");
          return;
        }
        if (Office && Office.context && Office.context.ui && typeof Office.context.ui.messageParent === "function") {
          try {
            Office.context.ui.messageParent(payload);
            dbg("messageParent OK", "log-ok");
          } catch (e) {
            showError("Could not relay sign-in result: " + e.message);
          }
        } else {
          dbg("Office.context.ui not ready — retrying (" + attempts + ")...");
          setTimeout(function() { tryMessageParent(attempts - 1); }, 500);
        }
      }

      // 60 × 500 ms = 30 s window — gives Office.js time to reinitialise
      // after the Microsoft → Duo → Microsoft → auth-dialog redirect chain.
      tryMessageParent(60);
    }

    var msalInstance = null;

    function createMsalInstance() {
      try {
        dbg("Creating MSAL instance...");
        msalInstance = new msal.PublicClientApplication({
          auth: {
            clientId: CLIENT_ID,
            authority: "https://login.microsoftonline.com/" + TENANT_ID,
            redirectUri: REDIRECT_URI,
            navigateToLoginRequestUrl: true
          },
          cache: { cacheLocation: "sessionStorage", storeAuthStateInCookie: false }
        });
        dbg("MSAL instance created OK", "log-ok");
        return true;
      } catch (e) {
        dbg("MSAL instance creation FAILED: " + e.message, "log-err");
        showError("Auth library init failed: " + e.message);
        return false;
      }
    }

    async function run() {
      dbg("run() started");
      if (!createMsalInstance()) return;

      try {
        setStep(2, "Initialising secure session…");
        dbg("calling initialize()...");
        await msalInstance.initialize();
        dbg("initialize() done", "log-ok");

        setStep(3, "Checking for existing sign-in…");
        dbg("calling handleRedirectPromise()...");

        // Race handleRedirectPromise against a 6-second timeout so it never hangs
        var redirectResponse = await Promise.race([
          msalInstance.handleRedirectPromise(),
          new Promise(function(resolve) {
            setTimeout(function() {
              dbg("handleRedirectPromise timeout — proceeding");
              resolve(null);
            }, 6000);
          })
        ]);

        dbg("handleRedirectPromise → " + (redirectResponse ? "GOT RESPONSE" : "null"), "log-ok");

        if (redirectResponse && redirectResponse.accessToken) {
          setStep(4, "Signed in — returning to Mail Merge…");
          dbg("Sending token to parent", "log-ok");
          sendToParent({ type: "token", token: redirectResponse.accessToken });
          return;
        }

        // Try silent token for existing accounts
        var accounts = msalInstance.getAllAccounts();
        dbg("accounts in cache: " + accounts.length);

        if (accounts.length > 0) {
          try {
            setStep(3, "Restoring your session…");
            dbg("trying silent token...");
            var silent = await msalInstance.acquireTokenSilent({ scopes: SCOPES, account: accounts[0] });
            dbg("silent token OK", "log-ok");
            setStep(4, "Signed in — returning to Mail Merge…");
            sendToParent({ type: "token", token: silent.accessToken });
            return;
          } catch (se) {
            dbg("silent failed: " + (se.errorCode || se.message));
          }
        }

        // Popup first — keeps dialog page alive so Office.context.ui stays intact
        // (redirect kills the page and legacy Mac Outlook loses messageParent on reload)
        setStep(4, "Opening Microsoft sign-in…");
        dbg("trying acquireTokenPopup...");
        try {
          var popupResponse = await msalInstance.acquireTokenPopup({ scopes: SCOPES });
          dbg("popup token OK", "log-ok");
          setStep(5, "Signed in — returning to Mail Merge…");
          sendToParent({ type: "token", token: popupResponse.accessToken });
          return;
        } catch (popupErr) {
          var pCode = popupErr.errorCode || "";
          dbg("popup error: " + pCode);
          // Only fall back to redirect if the popup was actually blocked/unavailable
          if (pCode === "popup_window_error" || pCode === "empty_window_error") {
            dbg("Popup blocked — falling back to redirect...");
            await msalInstance.acquireTokenRedirect({ scopes: SCOPES });
            dbg("acquireTokenRedirect called (page navigating away)");
          } else {
            throw popupErr;
          }
        }

      } catch (e) {
        var code = e.errorCode || "";
        var msg  = e.errorMessage || e.message || "Unknown error";
        dbg("CATCH: " + code + " — " + msg, "log-err");

        if (code === "interaction_in_progress") {
          sessionStorage.clear();
          var m = "Sign-in interrupted. Please close this window and try again.";
          showError(m);
          setTimeout(function() { sendToParent({ type: "error", message: m }); }, 3000);
          return;
        }
        showError(msg);
        setTimeout(function() { sendToParent({ type: "error", message: msg }); }, 3000);
      }
    }

    function startAuth() {
      setStep(1, "Preparing Office runtime…");
      dbg("registering Office.onReady...");
      Office.onReady(function() {
        dbg("Office.onReady fired", "log-ok");
        run();
      });
      // Fallback if onReady never fires within 5 s
      setTimeout(function() {
        if (!msalInstance) {
          dbg("Office.onReady timeout — running directly");
          run();
        }
      }, 5000);
    }

    if (typeof msal !== "undefined") {
      startAuth();
    }
  </script>
</body>
</html>
