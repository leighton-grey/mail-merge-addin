<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mail Merge – Sign In</title>
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self';
             script-src 'self' https://appsforoffice.microsoft.com https://alcdn.msauth.net https://cdn.jsdelivr.net 'unsafe-inline';
             connect-src 'self' https://login.microsoftonline.com https://login.microsoft.com https://graph.microsoft.com https://sts.windows.net https://appsforoffice.microsoft.com;
             style-src 'self' 'unsafe-inline';
             img-src 'self' data: https://login.microsoftonline.com;
             frame-src 'self' https://login.microsoftonline.com https://login.microsoft.com;" />

  <!-- Office.js must load first -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #f3f2f1;
      color: #323130;
      padding: 16px;
    }
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid #edebe9;
      border-top-color: #534AB7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #statusMsg { font-size: 14px; color: #605e5c; margin-bottom: 8px; }
    #errorMsg  { color: #d13438; font-size: 13px; margin-top: 8px; display: none; }
    #debugLog  {
      margin-top: 14px;
      width: 100%;
      max-width: 480px;
      background: #fff;
      border: 1px solid #e1dfdd;
      border-radius: 4px;
      padding: 8px;
      font-size: 11px;
      font-family: monospace;
      color: #201f1e;
      max-height: 260px;
      overflow-y: auto;
    }
    .log-line { padding: 1px 0; border-bottom: 1px solid #f3f2f1; }
    .log-err  { color: #d13438; }
  </style>
</head>
<body>
  <div class="spinner" id="spinner"></div>
  <p id="statusMsg">Signing you in to Mail Merge…</p>
  <p id="errorMsg"></p>
  <div id="debugLog"></div>

  <!-- Early debug logging — runs before MSAL loads -->
  <script>
    var logEl = document.getElementById("debugLog");
    function dbg(msg, isErr) {
      var d = document.createElement("div");
      d.className = "log-line" + (isErr ? " log-err" : "");
      d.textContent = new Date().toISOString().slice(11, 22) + " " + msg;
      logEl.appendChild(d);
      logEl.scrollTop = logEl.scrollHeight;
    }
    dbg("Page loaded — loading MSAL...");
  </script>

  <!-- MSAL from jsDelivr (primary) with alcdn fallback -->
  <script
    src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"
    crossorigin="anonymous"
    onerror="dbg('jsDelivr MSAL load FAILED — trying alcdn fallback', true); loadMsalFallback();">
  </script>

  <script>
    function loadMsalFallback() {
      var s = document.createElement("script");
      s.src = "https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js";
      s.crossOrigin = "anonymous";
      s.onload  = function() { dbg("alcdn MSAL fallback loaded OK"); startAuth(); };
      s.onerror = function() { dbg("BOTH MSAL CDNs failed!", true); showError("Could not load authentication library. Check network connection."); };
      document.head.appendChild(s);
    }

    // Check if MSAL loaded from jsDelivr
    if (typeof msal !== "undefined") {
      dbg("MSAL loaded OK from jsDelivr");
    }
  </script>

  <script>
    Office.initialize = function() {};

    const CLIENT_ID    = "d06ae3cf-a7da-4264-b20e-ab8d70c06977";
    const TENANT_ID    = "04ca7ab1-691d-45a2-928f-574b3e3300a0";
    const REDIRECT_URI = "https://leighton-grey.github.io/mail-merge-addin/auth-dialog.html";
    const SCOPES       = ["https://graph.microsoft.com/Mail.Send", "https://graph.microsoft.com/User.Read"];

    function showError(msg) {
      document.getElementById("spinner").style.display = "none";
      document.getElementById("statusMsg").style.display = "none";
      var el = document.getElementById("errorMsg");
      el.textContent = msg;
      el.style.display = "block";
      dbg("ERROR: " + msg, true);
    }

    function sendToParent(data) {
      dbg("sendToParent: " + data.type);
      try {
        Office.context.ui.messageParent(JSON.stringify(data));
        dbg("messageParent OK");
      } catch (e) {
        showError("Could not relay token: " + e.message);
      }
    }

    var msalInstance = null;

    function createMsalInstance() {
      try {
        dbg("Creating MSAL instance...");
        msalInstance = new msal.PublicClientApplication({
          auth: {
            clientId: CLIENT_ID,
            authority: "https://login.microsoftonline.com/" + TENANT_ID,
            redirectUri: REDIRECT_URI,
            navigateToLoginRequestUrl: true
          },
          cache: { cacheLocation: "sessionStorage", storeAuthStateInCookie: false }
        });
        dbg("MSAL instance created OK");
        return true;
      } catch (e) {
        dbg("MSAL instance creation FAILED: " + e.message, true);
        showError("Auth library init failed: " + e.message);
        return false;
      }
    }

    async function run() {
      dbg("run() started");
      if (!createMsalInstance()) return;

      try {
        dbg("calling initialize()...");
        await msalInstance.initialize();
        dbg("initialize() done");

        dbg("calling handleRedirectPromise()...");
        var redirectResponse = await msalInstance.handleRedirectPromise();
        dbg("handleRedirectPromise() done — " + (redirectResponse ? "GOT RESPONSE" : "null"));

        if (redirectResponse && redirectResponse.accessToken) {
          dbg("Sending token to parent");
          sendToParent({ type: "token", token: redirectResponse.accessToken });
          return;
        }

        var accounts = msalInstance.getAllAccounts();
        dbg("accounts: " + accounts.length);

        if (accounts.length > 0) {
          try {
            dbg("trying silent...");
            var silent = await msalInstance.acquireTokenSilent({ scopes: SCOPES, account: accounts[0] });
            dbg("silent OK");
            sendToParent({ type: "token", token: silent.accessToken });
            return;
          } catch (se) {
            dbg("silent failed: " + (se.errorCode || se.message));
          }
        }

        document.getElementById("statusMsg").textContent = "Redirecting to sign-in…";
        dbg("calling acquireTokenRedirect...");
        await msalInstance.acquireTokenRedirect({ scopes: SCOPES });
        dbg("acquireTokenRedirect returned (page should have navigated)");

      } catch (e) {
        var code = e.errorCode || "";
        var msg  = e.errorMessage || e.message || "Unknown error";
        dbg("CATCH: " + code + " — " + msg, true);

        if (code === "interaction_in_progress") {
          sessionStorage.clear();
          var m = "Sign-in interrupted. Close and try again.";
          showError(m);
          setTimeout(function() { sendToParent({ type: "error", message: m }); }, 3000);
          return;
        }
        showError(msg);
        setTimeout(function() { sendToParent({ type: "error", message: msg }); }, 3000);
      }
    }

    function startAuth() {
      dbg("registering Office.onReady...");
      Office.onReady(function() {
        dbg("Office.onReady fired");
        run();
      });
      // Fallback if onReady never fires
      setTimeout(function() {
        if (!msalInstance) {
          dbg("Office.onReady timeout — running directly");
          run();
        }
      }, 5000);
    }

    // Only start if MSAL loaded synchronously (jsDelivr path)
    if (typeof msal !== "undefined") {
      startAuth();
    }
    // If MSAL didn't load, loadMsalFallback() will call startAuth() on success
  </script>
</body>
</html>
